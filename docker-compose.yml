services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    volumes:
      - raptor_data:/data
    environment:
      DB_PATH: /data/portal.sqlite3
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped

volumes:
  raptor_data:
