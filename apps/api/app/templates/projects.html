<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects · DOGFOOD</title><link rel="stylesheet" href="/static/style.css"><main><nav><a href="/">Home</a> · <a href="/login">Sign in</a></nav><h1>Projects</h1><p>Submitted entries in the sample event.</p><form method="get"><label>Search <input name="q" value="{{q}}"></label><label>Track <select name="track"><option value="">All tracks</option>{% for t in tracks %}<option value="{{t.id}}" {% if track==t.id %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select></label><button>Filter</button></form><p>{{projects|length}} project records</p><section class="grid">{% for p in projects %}<article><p class="eyebrow">{{p.track_name}} · {{p.team_name}}</p><h2><a href="/projects/{{p.id}}">{{p.title}}</a></h2><p>{{p.summary}}</p><small>{{p.id}}</small></article>{% else %}<p>No matching projects.</p>{% endfor %}</section></main></html>
